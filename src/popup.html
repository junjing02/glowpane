<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon48.png" width="22" height="22" alt="" />
    <h1>Glowpane</h1>
    <label class="master" for="splitEnabled" title="Turn the whole extension on or off">
      <input type="checkbox" id="splitEnabled" role="switch" aria-label="Split layout" />
      <span class="switch" aria-hidden="true"></span>
    </label>
  </header>

  <main id="options">
    <h2>Layout</h2>
    <label class="row" for="twoWindowMode">
      <span class="text">
        <span class="title">Two windows</span>
        <span class="desc">Keep the video here and open everything else in a second window.</span>
      </span>
      <input type="checkbox" id="twoWindowMode" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="row compact" for="sideWidth">
      <span class="title">Side pane width</span>
      <select id="sideWidth">
        <option value="auto">Fit the video</option>
        <option value="narrow">Narrow</option>
        <option value="balanced">Balanced</option>
        <option value="wide">Half and half</option>
      </select>
    </label>

    <label class="row compact" for="videoOnRight" title="Swap sides: panes on the left, video on the right.">
      <span class="title">Video on the right</span>
      <input type="checkbox" id="videoOnRight" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="row compact" for="rememberLayout" title="Keep pane sizes and collapsed panes from one video to the next.">
      <span class="title">Remember my layout</span>
      <input type="checkbox" id="rememberLayout" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <h2>Glow</h2>
    <label class="row compact" for="ambientEnabled" title="Glow the video's colors behind the page. In dark theme it follows YouTube's Ambient mode.">
      <span class="title">Ambient light</span>
      <input type="checkbox" id="ambientEnabled" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="row slider-row" for="ambientStrength">
      <span class="title">In dark theme</span>
      <input type="range" id="ambientStrength" min="10" max="100" step="5" />
      <output id="ambientStrengthValue" for="ambientStrength"></output>
    </label>

    <label class="row slider-row" for="ambientStrengthLight">
      <span class="title">In light theme</span>
      <input type="range" id="ambientStrengthLight" min="10" max="100" step="5" />
      <output id="ambientStrengthLightValue" for="ambientStrengthLight"></output>
    </label>

    <h2>Panes</h2>
    <label class="row compact" for="showDescription">
      <span class="title">Show description</span>
      <input type="checkbox" id="showDescription" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="row compact" for="showRecommendations">
      <span class="title">Show recommendations</span>
      <input type="checkbox" id="showRecommendations" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="row compact" for="showComments">
      <span class="title">Show comments</span>
      <input type="checkbox" id="showComments" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="row compact" for="onePaneAtATime" title="Opening Recommended closes Comments, and the other way round, so the open one gets all the room.">
      <span class="title">One pane at a time</span>
      <input type="checkbox" id="onePaneAtATime" role="switch" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="row compact range-row" for="paneTransparency">
      <span class="title">Transparency</span>
      <input type="range" id="paneTransparency" min="0" max="100" step="5" />
      <output id="paneTransparencyValue" for="paneTransparency"></output>
    </label>
  </main>

  <footer>
    <span class="links">
      <a href="#" id="shortcuts">Shortcuts</a>
      <a href="https://github.com/junjing02/glowpane/releases" target="_blank" rel="noopener">What's new</a>
      <a href="https://github.com/junjing02/glowpane/issues/new/choose" target="_blank" rel="noopener">Report a problem</a>
    </span>
    <span class="meta">
      <span id="version"></span>
      <a href="https://chromewebstore.google.com/detail/glowpane-comments-beside/nmdfidalgjjfgiekdkcjohnfaehojdin/reviews" target="_blank" rel="noopener" title="Rate it on the Chrome Web Store">Rate Glowpane</a>
      <a href="#" id="reset" title="Put every setting back to how it started">Reset settings</a>
    </span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
